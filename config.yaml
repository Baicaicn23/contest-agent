# 配置文件：站点源 + 模型档案。
# 密钥绝不写在这里，只写"密钥的环境变量名"（env 优先原则见 settings.py）。

active_model: deepseek

# —— M1 成本控制 ——
# 单任务预算上限（元）：一次 sai identify / generate / study-path 的 LLM 花费
# 达到这个数就熔断（后续调用被拦下，已完成部分保留）。null = 不限预算。
# 临时实验可用环境变量覆盖：BUDGET_PER_TASK_YUAN=5（设 0 表示关闭）
budget_per_task_yuan: null

# 按任务路由模型档案：高频任务配便宜模型、低频重活配强模型。
# 没列出的任务用 active_model 兜底。台账（sai cost）里能查证每个任务实际用了谁
routing:
  identify: deepseek     # 识别是"一问一答"的高频调用，适合便宜快速的模型
  generate: deepseek     # 材料生成是多轮重活，适合强模型
  study_path: deepseek   # 备考路径要联网搜索多轮，同样吃模型能力

# agent 循环的上下文压缩阈值：上下文占用达到模型窗口的 80% 时，
# 框架自动把旧对话压成结构化摘要（长任务不再撑爆窗口，见 ADR-003）
context:
  trigger_ratio: 0.8

# —— M3 定时推送 ——
# 三个通道互相独立：配了哪个就启用哪个，全不配 = 只在终端播报。
# 配好后用 cron 定时跑：*/30 8-22 * * * cd /path/to/contest-agent && uv run sai watch
push:
  # webhook：钉钉/企业微信/Server酱等机器人的通用形态，POST JSON 到这个地址
  webhook_url: null
  webhook_timeout: 10
  # file：本地文件通道，通知落成 Markdown（调试利器，也是推送存档）
  file_dir: output/notifications
  # smtp：邮件通道（密码走环境变量 SMTP_PASSWORD，绝不写进本文件）
  # smtp:
  #   host: smtp.qq.com
  #   port: 465
  #   user: your@qq.com
  #   to_addrs: [your@qq.com]

# —— M5 权限门 ——
# 两个名单都是空 = 所有工具照旧自动放行（v1 以来的默认）。
# confirm_tools：终端有人时，执行前要 y/N 确认的工具名，例如 [save_material]；
# unattended_deny_tools：无人值守（cron / sai watch / HTTP 服务）时一律拒绝的工具名。
permissions:
  confirm_tools: []
  unattended_deny_tools: []

# 完全访问总闸（M5 前端"⚠ 完全访问"开关写这里）：
# true = 权限门全放行（上面名单忽略）；false = 名单生效
access_full: false

# —— M5 插件开关（前端插件市场写这里）——
# false 的能力对应接口返回 503（前端显示"未安装"）
features:
  deadlines: true     # 截止日期守望
  eval: false
  watch: true         # 定时盯梢
  pptx: true          # 生成材料导出 .pptx

# 联网搜索（P5 学习路径用）：国内可直连、无需密钥；主引擎被风控时自动切回退引擎
search:
  engine_url: https://cn.bing.com/search?q={query}&count=12   # 主引擎：Bing 中国版
  fallback_engine_url: https://www.so.com/s?q={query}         # 回退引擎：360 搜索
  max_results: 6                                              # 每次搜索最多返回几条

models:
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat
    # 计费单价（元/百万 token），照服务商价目页填，调价改这里即可。
    # 不填 = 台账只记 token 不算钱。以下为 2026-09 填写的参考值
    input_price_per_m: 2.0
    output_price_per_m: 8.0
  qwen:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    model: qwen-plus
    input_price_per_m: 0.8
    output_price_per_m: 2.0

sources:
  - name: cupk_szxy   # 中国石油大学（北京）克拉玛依校区 · 数理与人工智能学院
    base_url: https://www.cupk.edu.cn
    list_path: /szxy/tzgg/          # 通知公告列表页（首页"通知公告"栏目的 more 指向这里）
    detail_pattern: /szxy/c/{date}/{id}.shtml
    request_interval: 1.5   # 爬虫限速：相邻请求最小间隔（秒）

    # CSS 选择器：2026-09-30 对照真实页面模板分析得出（过程见讲解文档 11-P1）。
    # 网站改版时只需要更新这里，解析代码不用动。
    selectors:
      item: "div.middleArticle__art--art"           # 列表页：一条通知条目
      link: "a.middleArticle__art--link"            # 列表页：条目里的标题链接
      title: "h3.middleArticle__art--titles"        # 列表页：通知标题
      year: "span.middleArticle__art--day"          # 列表页：日期的"年"部分（如 2026）
      month_day: "span.middleArticle__art--month"   # 列表页：日期的"月-日"部分（如 09-29）
      detail_title: "div.c-right-detail__title-name"    # 详情页：标题
      detail_content: "div.c-right-detail__content"     # 详情页：正文容器
