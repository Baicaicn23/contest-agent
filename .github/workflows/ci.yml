# CI：每次推送/PR 自动跑离线测试。
# 注意 addopts 里已排除 live 标记（联网、花钱的验收只在本地手动跑），
# 所以 CI 不需要任何密钥。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: uv sync

      - name: 跑测试（离线）
        run: uv run pytest -q
